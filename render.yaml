services:
  - type: web
    name: tg-growth-os-vovaromadin
    runtime: docker
    repo: https://github.com/vovaromadin/telescope-saas
    branch: main
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: TG Ракета
      - key: APP_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://tg-growth-os-vovaromadin.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: TG_BOT_USERNAME
        value: TGRaketa_bot
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_WEBHOOK_SECRET
        generateValue: true
